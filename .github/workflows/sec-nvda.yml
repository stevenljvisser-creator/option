name: SEC EDGAR NVDA quarterly test
on:
  workflow_dispatch:
    inputs:
      user_agent:
        description: 'Declared SEC User-Agent (project and contact identification)'
        required: true
        default: 'OptionEdge SEC Research/1.0 stevenljvisser-creator https://github.com/stevenljvisser-creator/option'
        type: string
permissions:
  contents: read
concurrency:
  group: sec-nvda-acceptance
  cancel-in-progress: false
jobs:
  sec-nvda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEC_USER_AGENT: ${{ inputs.user_agent }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-sec.txt
      - name: Install Parquet dependency
        run: python -m pip install -r scripts/requirements-sec.txt
      - name: Test quarter selection and availability rules
        run: python -m unittest discover -s scripts -p test_sec_nvda.py -v
      - name: Fetch SEC NVDA and verify Parquet
        run: python scripts/sec_nvda.py
      - name: Upload SEC NVDA data and acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sec-nvda-quarterly-${{ github.run_id }}
          path: sec-nvda-output/
          if-no-files-found: error
          retention-days: 30
